services:
  postgres:
    image: postgres:16-alpine
    container_name: task-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-taskdb}
      POSTGRES_USER: ${DATABASE_USER:-taskuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - three-tier-net
    # PostgreSQL is NOT exposed to the host by default -- only the
    # backend service (on the same Docker network) can reach it.
    # Uncomment to expose it for local debugging with a DB client:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-taskuser} -d ${DATABASE_NAME:-taskdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: three-tier-python-backend:latest
    container_name: task-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_PORT:-5000}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-taskdb}
      DATABASE_USER: ${DATABASE_USER:-taskuser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changeme}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - three-tier-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Run pending Alembic migrations, then hand off to the image's own
    # CMD (gunicorn). See docs/DEVOPS_HANDOVER.md section "Database
    # Migration Strategy" for why migrations run here rather than as a
    # baked-in image step.
    command: >
      sh -c "flask db upgrade &&
             gunicorn --bind 0.0.0.0:${APP_PORT:-5000} --workers ${GUNICORN_WORKERS:-4}
             --graceful-timeout 30 --timeout 60
             --access-logfile - --error-logfile - wsgi:app"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: three-tier-python-frontend:latest
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - three-tier-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  three-tier-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
