apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: task-management-backend:1.0.0

          ports:
            - name: http
              containerPort: 5000
          
          resources:
            requests:
              cpu: "256m"
              memory: "256Mi"
            limits:
              cpu: "512m"
              memory: "512Mi"
          
          envFrom:
            - secretKeyRef:
                name: backend-secret

          statupProbe:
            httpGet:
              path: /health/start
              port: http
            initialDelaySeconds: 10s
            periodSeconds: 10s
            timeoutSeconds: 5s
            successThreshold: 3
            FailureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30s
            periodSeconds: 20s
            timeoutSeconds: 5s
            successThreshold: 3
            FailureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20s
            periodSeconds: 10s
            timeoutSeconds: 5s
            successThreshold: 3
            FailureThreshold: 5