apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: webapps
spec:
  serviceName: postgres
  replicas: 3
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgresql:16

          ports:
            - name: http
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              ValueFrom:
                secretKeyRef: 
                  name: db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              ValueFrom:
                secretKeyRef: 
                  name: db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              ValueFrom:
                secretKeyRef: 
                  name: db-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "256m"
              memory: "256Mi"
            limits:
              cpu: "512m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready
                - -U
                - $POSTGRES_USER
                - -d
                - $POSTGRES_DB
            initialDelaySeconds: 10s
            timeoutSeconds: 5s
            successThreshold: 3
            failureThreshold: 5
            periodSeconds: 10s

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready
                - -U
                - $POSTGRES_USER
                - -d
                - $POSTGRES_DB
            initialDelaySeconds: 20s
            timeoutSeconds: 5s
            successThreshold: 3
            failureThreshold: 5
            periodSeconds: 10s

          volumeMounts:
            - name: psql_data
              mountPath: /var/lib/postgresql/data

volumeClaimTemplates:
  - metadata:
      name: psql_data
    spec:
      accessMode: ["ReadWriteOnce"]

      resources:
        requests:
          storage: 1Gi

      storageClassName: postgres-sc