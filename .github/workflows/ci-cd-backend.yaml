name: DevSecOps Backend CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths-ignore:
      - "Kubernetes-Manifests/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: bhanus95/task-management-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================
  # 1. GITLEAKS
  # ============================================================
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # 2. TESTING
  # ============================================================
  testing:
    name: Test and Code Quality
    runs-on: ubuntu-24.04
    needs: gitleaks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: |
          ruff check . --fix
          ruff check .

      - name: Black
        working-directory: backend
        run: |
          black .
          black --check .

      - name: Pytest
        working-directory: backend
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14

  # ============================================================
  # 3. TRIVY FILESYSTEM
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    needs: testing

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

  # ============================================================
  # 5. SONARQUBE ANALYSIS
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-24.04
    needs: trivy-fs

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate coverage
        working-directory: backend
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=xml:coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectBaseDir=backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================
  # 6. SONARQUBE QUALITY GATE
  # ============================================================
  quality-gate:
    name: SonarQube Quality Gate
    runs-on: ubuntu-24.04
    needs: sonarqube

    steps:
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================
  # 7. BUILD IMAGE
  # ============================================================
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: quality-gate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image tag
        id: image
        shell: bash
        run: |
          echo "image=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ============================================================
  # 8. TRIVY IMAGE SCAN
  # ============================================================
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-24.04
    needs: build-image

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for security scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif

  # ============================================================
  # 9. DOCKER HUB PUSH
  # ============================================================
  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-24.04
    needs:
      - build-image
      - trivy-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  # ============================================================
  # 10. GITOPS UPDATE
  # ============================================================
  gitops:
    name: Update Kustomize Manifests
    runs-on: ubuntu-24.04
    needs: docker-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Verify manifest path exists
        shell: bash
        run: |
          test -f "Kubernetes-Manifests/overlay/production/backend/kustomization.yaml" || {
            echo "Missing Kustomize file at Kubernetes-Manifests/overlay/production/backend/kustomization.yaml"
            exit 1
          }

      - name: Update backend image
        working-directory: Kubernetes-Manifests/overlay/production/backend
        run: |
          kustomize edit set image \
            bhanus95/task-management-backend=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Show manifest change
        run: |
          git diff -- Kubernetes-Manifests/overlay/production/backend/kustomization.yaml

      - name: Commit GitOps change
        shell: bash
        run: |
          git config user.name "bhanu"
          git config user.email "bs.shakya55@gmail.com"

          git add Kubernetes-Manifests/overlay/production/backend/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "chore(gitops): update backend image to ${IMAGE_TAG} [skip ci]"
          git push
