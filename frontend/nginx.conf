server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API calls to the backend service.
    # The backend hostname ("backend") is the Docker Compose service
    # name / Kubernetes Service name and is resolved via internal DNS.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints proxied too, so the frontend's own status widget
    # can reach the backend without hard-coding its internal address.
    location /health/ {
        proxy_pass http://backend:5000/health/;
        proxy_set_header Host $host;
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
