```yaml
services:

  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: task-management-postgres

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: changeme

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - task-management-network


  # =========================
  # Backend
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: task-management-backend:1.0.0
    container_name: task-management-backend

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_PORT: 5000
      LOG_LEVEL: INFO

      SECRET_KEY: change-me

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taskdb
      DATABASE_USER: taskuser
      DATABASE_PASSWORD: changeme

      CORS_ORIGINS: "*"

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - task-management-network


  # =========================
  # Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: task-management-frontend:1.0.0
    container_name: task-management-frontend

    depends_on:
      backend:
        condition: service_started

    ports:
      - "3000:3000"

    networks:
      - task-management-network


# =========================
# Persistent Storage
# =========================
volumes:
  postgres_data:


# =========================
# Private Application Network
# =========================
networks:
  task-management-network:
    driver: bridge
```
